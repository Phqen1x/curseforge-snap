name: Update CurseForge Snap

on:
  schedule:
    - cron: '0 8 * * *'  # Daily at 08:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Force build even if version is unchanged
        type: boolean
        default: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      deb_version: ${{ steps.deb.outputs.version }}
      edge_version: ${{ steps.edge.outputs.version }}
      needs_update: ${{ steps.compare.outputs.needs_update }}
    steps:
      - name: Fetch upstream .deb version
        id: deb
        run: |
          curl -fL -o /tmp/curseforge.deb \
            "https://curseforge.overwolf.com/downloads/curseforge-latest-linux.deb"
          VERSION=$(dpkg-deb --showformat='${Version}' --show /tmp/curseforge.deb \
            | cut -d'~' -f1)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Upstream .deb version: $VERSION"

      - name: Get current Snap Store edge version
        id: edge
        run: |
          VERSION=$(curl -sf \
            -H "Snap-Device-Series: 16" \
            "https://api.snapcraft.io/v2/snaps/info/curseforge" \
            | jq -r '
                [.["channel-map"][]
                  | select(.channel.name == "latest/edge")
                  | .version
                ][0] // "none"
              ')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Edge channel version: $VERSION"

      - name: Decide whether a build is needed
        id: compare
        run: |
          DEB="${{ steps.deb.outputs.version }}"
          EDGE="${{ steps.edge.outputs.version }}"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$DEB" != "$EDGE" ] || [ "$FORCE" = "true" ]; then
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "Update needed: deb=$DEB edge=$EDGE force=$FORCE"
          else
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "Already up to date ($DEB) — skipping build"
          fi

  build-and-publish:
    needs: check-version
    if: needs.check-version.outputs.needs_update == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Publish to edge channel
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: edge
